name: Build Plugins (Windows + macOS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target AuricMaster_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster-VST3-Windows
          path: build/AuricMaster_artefacts/Release/VST3/

  build-macos:
    runs-on: macos-15-intel   # macos-14 image was retired by GitHub; this runner still builds a universal (arm64 + x86_64) plugin
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (Universal: Apple Silicon + Intel)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target AuricMaster_VST3 AuricMaster_AU
      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist
          cp -R "build/AuricMaster_artefacts/Release/VST3/Auric Master.vst3" dist/
          cp -R "build/AuricMaster_artefacts/Release/AU/Auric Master.component" dist/
          codesign --force --deep --sign - "dist/Auric Master.vst3"
          codesign --force --deep --sign - "dist/Auric Master.component"
          ditto -c -k --keepParent dist AuricMaster-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster-macOS
          path: AuricMaster-macOS.zip

  # ---------------- Auric Master 2 ----------------
  am2-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S AuricMaster2 -B build-am2 -A x64
      - name: Build
        run: cmake --build build-am2 --config Release --target AuricMaster2_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster2-VST3-Windows
          path: build-am2/AuricMaster2_artefacts/Release/VST3/

  am2-macos:
    runs-on: macos-15-intel   # Apple-Silicon runners are often at capacity; this one still builds a universal (arm64 + x86_64) plugin
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (Universal: Apple Silicon + Intel)"
        run: cmake -S AuricMaster2 -B build-am2 -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build-am2 --config Release --target AuricMaster2_VST3 AuricMaster2_AU
      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist
          cp -R "build-am2/AuricMaster2_artefacts/Release/VST3/Auric Master 2.vst3" dist/
          cp -R "build-am2/AuricMaster2_artefacts/Release/AU/Auric Master 2.component" dist/
          codesign --force --deep --sign - "dist/Auric Master 2.vst3"
          codesign --force --deep --sign - "dist/Auric Master 2.component"
          ditto -c -k --keepParent dist AuricMaster2-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster2-macOS
          path: AuricMaster2-macOS.zip

  # ---------------- Auric Master 3 ----------------
  am3-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S AuricMaster3 -B build-am3 -A x64 -DAM3_BUILD_TESTS=ON
      - name: Build plugin and tests
        run: cmake --build build-am3 --config Release --target AuricMaster3_VST3 AM3Tests
      - name: Run test suite (fails the build on any failed check)
        run: build-am3/AM3Tests_artefacts/Release/AM3Tests.exe
      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          New-Item -ItemType Directory -Force -Path pv-logs | Out-Null
          $pvArgs = '--strictness-level 10 --verbose --timeout-ms 600000 --output-dir pv-logs --validate "build-am3/AuricMaster3_artefacts/Release/VST3/Auric Master 3.vst3"'
          $p = Start-Process -FilePath ./pluginval/pluginval.exe -ArgumentList $pvArgs -Wait -PassThru -NoNewWindow
          Get-ChildItem pv-logs -File | ForEach-Object { Get-Content $_.FullName }
          Write-Host "pluginval exit code: $($p.ExitCode)"
          exit $p.ExitCode
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc AuricMaster3/installer/AuricMaster3.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster3-VST3-Windows
          path: build-am3/AuricMaster3_artefacts/Release/VST3/
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster3-Setup-Windows
          path: installer-out/AuricMaster3-Setup-Windows.exe

  am3-macos:
    runs-on: macos-15-intel   # still builds a universal (arm64 + x86_64) plugin
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (Universal: Apple Silicon + Intel)"
        run: cmake -S AuricMaster3 -B build-am3 -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DAM3_BUILD_TESTS=ON
      - name: Build plugin and tests
        run: cmake --build build-am3 --config Release --target AuricMaster3_VST3 AuricMaster3_AU AM3Tests
      - name: Run test suite (fails the build on any failed check)
        run: build-am3/AM3Tests_artefacts/Release/AM3Tests
      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist
          cp -R "build-am3/AuricMaster3_artefacts/Release/VST3/Auric Master 3.vst3" dist/
          cp -R "build-am3/AuricMaster3_artefacts/Release/AU/Auric Master 3.component" dist/
          codesign --force --deep --sign - "dist/Auric Master 3.vst3"
          codesign --force --deep --sign - "dist/Auric Master 3.component"
          ditto -c -k --keepParent dist AuricMaster3-macOS.zip
      - name: Validate with pluginval (strictness 10) and auval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=./pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --verbose --timeout-ms 600000 --validate "dist/Auric Master 3.vst3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/Auric Master 3.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx AuM3 Auri
          $PV --strictness-level 10 --verbose --timeout-ms 600000 --validate ~/Library/Audio/Plug-Ins/Components/"Auric Master 3.component"
      - name: Build installer (.pkg)
        run: sh AuricMaster3/installer/build-macos-pkg.sh 3.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster3-macOS
          path: AuricMaster3-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster3-macOS-Installer
          path: "Auric Master 3 Installer.pkg"
