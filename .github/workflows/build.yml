name: Build Plugins (Windows + macOS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target AuricMaster_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster-VST3-Windows
          path: build/AuricMaster_artefacts/Release/VST3/

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (Universal: Apple Silicon + Intel)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target AuricMaster_VST3 AuricMaster_AU
      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist
          cp -R "build/AuricMaster_artefacts/Release/VST3/Auric Master.vst3" dist/
          cp -R "build/AuricMaster_artefacts/Release/AU/Auric Master.component" dist/
          codesign --force --deep --sign - "dist/Auric Master.vst3"
          codesign --force --deep --sign - "dist/Auric Master.component"
          ditto -c -k --keepParent dist AuricMaster-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AuricMaster-macOS
          path: AuricMaster-macOS.zip
